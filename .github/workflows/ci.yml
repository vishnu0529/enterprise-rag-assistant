name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t enterprise-rag-assistant:ci .

  eval-gate:
    # Does NOT call a live LLM. It used to re-run scripts/run_golden_set.py
    # against Gemini on every push, but that burns real API credits per run
    # and broke CI outright once the GOOGLE_API_KEY account's prepaid
    # credits were exhausted (402 RESOURCE_EXHAUSTED) — a billing problem,
    # not a regression. Instead this verifies the golden-set result already
    # committed at eval/golden_set_metrics.json (last produced by a genuine
    # live run, see docs/EVALUATION.md#ci-merge-gate) still shows a full
    # pass. To refresh that number with a fresh live run, use the
    # publish-eval-metrics workflow_dispatch below once a working LLM key
    # is available.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed golden-set result is a full pass
        run: python scripts/check_golden_set_metrics.py

  publish-eval-metrics:
    # Manual only: this re-runs the golden set against a live LLM and
    # commits refreshed numbers. Not run on every push since that would
    # spend real API credits (see eval-gate above); trigger it by hand
    # (Actions tab -> this workflow -> Run workflow) once a working
    # GOOGLE_API_KEY or ANTHROPIC_API_KEY is in place.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # See the eval-gate job's comment on why this pacing is required.
      LLM_MIN_INTERVAL_SECONDS: "6.5"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check for an LLM API key
        id: check_key
        run: |
          if [ -z "$GOOGLE_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No GOOGLE_API_KEY or ANTHROPIC_API_KEY secret configured; can't refresh the golden-set numbers without a working LLM key."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run golden-set live
        if: steps.check_key.outputs.skip != 'true'
        run: python scripts/run_golden_set.py
      - name: Regenerate the trend chart
        if: steps.check_key.outputs.skip != 'true'
        run: python scripts/update_eval_chart.py
      - name: Commit updated eval metrics
        if: steps.check_key.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/golden_set_metrics.json eval/metrics_history.jsonl eval/golden_set_results.md docs/EVALUATION.md
          git diff --cached --quiet || git commit -m "Update golden-set eval metrics [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
